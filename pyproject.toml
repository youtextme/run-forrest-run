[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runforrestrun"
version = "0.2.0"
description = "Run, Forrest, Run! — the objective-runner platform. One install. Every prompt. Shared trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
run-forrest-run = "runforrestrun.__main__:main"

[project.urls]
Homepage = "https://github.com/youtextme/run-forrest-run"
Repository = "https://github.com/youtextme/run-forrest-run"
Documentation = "https://github.com/youtextme/run-forrest-run#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["runforrestrun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
